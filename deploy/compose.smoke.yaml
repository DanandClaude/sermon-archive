# Adds a throwaway bucket (MinIO) and mail catcher (Mailpit) so the whole stack can be tried on one
# computer with no accounts. Used by smoke-test.sh. Not for real use.
services:
  minio:
    image: quay.io/minio/minio:latest
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  minio-setup:
    image: quay.io/minio/mc:latest
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done && mc mb --ignore-existing local/sermon-archive-smoke',
      ]
    depends_on:
      - minio
    restart: 'no'

  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025']

  web:
    depends_on:
      minio-setup: { condition: service_completed_successfully }

  worker:
    depends_on:
      minio-setup: { condition: service_completed_successfully }

  backup:
    depends_on:
      minio-setup: { condition: service_completed_successfully }

  caddy:
    ports: !override ['8080:80']
