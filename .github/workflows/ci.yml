name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sermon_archive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sermon_archive_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Migrations match the schema
        run: |
          npm run db:generate
          test -z "$(git status --porcelain drizzle)" || { git status --porcelain drizzle; echo "Schema changed without a migration. Run npm run db:generate and commit drizzle/."; exit 1; }
      - run: npm test
      - run: npm run build

  worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WORKER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sermon_archive_worker_test
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: worker/.python-version
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest

  images:
    # The Docker images must keep building, or the install guide stops working.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=ci-web
          cache-to: type=gha,mode=max,scope=ci-web
      - name: Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: false
          cache-from: type=gha,scope=ci-worker
          cache-to: type=gha,mode=max,scope=ci-worker
      - name: The compose file is valid
        run: |
          cd deploy
          cp .env.production.example .env
          docker compose -f compose.yaml config -q
