[project]
name = "sermon-worker"
version = "0.1.0"
description = "Audio cleanup and transcription worker for Sermon Archive"
requires-python = ">=3.12"
dependencies = [
  "faster-whisper>=1.2,<2",
  "numpy>=2",
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.35,<2",
  "anthropic>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Apple Silicon only: transcribes on the Mac's GPU, several times faster than the CPU.
mlx = ["mlx-whisper>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
markers = ["real_model: needs a downloaded Whisper model; skipped unless WHISPER_MODEL_PATH is set"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Long strings (SQL, messages, test data) can't be wrapped by the formatter.
ignore = ["E501"]
